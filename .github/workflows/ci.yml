name: HustleHub CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hustlehub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hustlehub-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hustlehub-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hustlehub-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hustlehub-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker-and-api:
    name: Docker and API integration validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      CI_JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-only-test-secret-that-is-at-least-32-characters' }}
      AUTH_RATE_LIMIT_MAX: 1000
      BOOKING_RATE_LIMIT_MAX: 1000
    steps:
      - uses: actions/checkout@v4

      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml config

      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build api client

      # NEW: throwaway certs so the api bind mounts (certs/docker/api.key, api.crt) exist in CI
      - name: Generate throwaway CI certs
        run: |
          mkdir -p certs/docker
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -keyout certs/docker/api.key -out certs/docker/api.crt
          chmod 644 certs/docker/api.key certs/docker/api.crt

      - run: bash scripts/ci-newman.sh

      # NEW: prints the API's own startup error when the job fails (runs before teardown)
      - name: Debug on failure
        if: failure()
        run: |
          ls -la certs/docker || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs api

      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v --remove-orphans
        if: always()