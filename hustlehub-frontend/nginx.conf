server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # 'unsafe-inline' is allowed only for React style attributes.
    # https://images.unsplash.com is used by the gig cover images.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://images.unsplash.com data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream https://api:5000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name api;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/certs/api.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
